[project]
name = "topo-sigma-runtime"
version = "1.0.0"
description = "Locked Python runtime for the ROS 2 visual topological mapping workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gtsam==4.3a0",
    "matplotlib>=3.10,<4",
    # Jazzy's binary cv_bridge is built against the NumPy 1.x C ABI.
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "pillow>=11,<13",
    "pyyaml>=6,<7",
    "scipy>=1.15,<2",
    # colcon-python-setup-py still invokes `setup.py develop --uninstall`;
    # setuptools 80 removed that legacy option.
    "setuptools>=75,<80",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=5.2,<6",
]

[tool.uv]
package = false
python-preference = "only-system"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["vts_ws/src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "vts_bringup",
    "vts_core",
    "vts_evaluation",
    "vts_language",
    "vts_mapping",
    "vts_players",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine == 'aarch64'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
