# COLD Saarbrücken part B — environment configuration.
# Everything dataset-specific lives here, not in code.
player:
  dataset_root: "/workspace/encoder/seq_data"
  # Single-run pipeline: map one sequence at a time.
  sequences:
    - "cold-saarbruecken_part_b_seq4_sunny1"
  images_subdir: "std_cam"
  labels_subpath: "localization/places.lst"   # relative to each sequence dir
  odometry_subpath: "odom_scans/odom.tdf"
  max_odometry_gap_s: 1.0
  publish_rate_hz: 5.0
  inter_sequence_pause_s: 5.0
  # Fixed motion-model coefficients used only to propagate uncertainty over
  # the recorded wheel odometry; the measured trajectory is never perturbed.
  odometry_uncertainty: [0.025, 0.005, 0.01, 0.0025]

mapping:
  # Fixed hyperparameter set shared by ALL environments (no per-environment
  # tuning): valley_k / visual_outlier_k = 2.0 / 2.0.
  window_size: 30
  valley_k: 2.0              # node-creation sensitivity (lower = more, finer-grained nodes)
  visual_outlier_k: 2.0      # visual revisit strictness (MAD multiplier); lower = more merges / loop closures
  gate_mode: "both"          # revisit-gate ablation: both|visual|geometric|threshold (CLI: gate_mode:=...)
  naive_threshold: 0.7       # absolute similarity threshold for the "threshold" ablation baseline
  optimize: false            # final method; GTSAM retained only as an ablation
  dino_model: "dinov2_vits14" # frozen stock backbone; no training/checkpoint
  use_ground_truth: true      # synchronized evaluation metadata; never used to map
  output_dir: "output/revised/saarbruecken_ext"
  run_name: "saarbruecken_ext"

language:
  graph_path: "output/revised/saarbruecken_ext/graph_0_noopt.pkl"
  semantic_model: "openai/clip-vit-base-patch32"
  mode: "manual"             # "manual" (one-shot query_sentence) or "topic" (live /language/command)
  query_sentence: "corridor"
  top_k: 3
  output_dir: "output/revised/saarbruecken_ext/commands"
