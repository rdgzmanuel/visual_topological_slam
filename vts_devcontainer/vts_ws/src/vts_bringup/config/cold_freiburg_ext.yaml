# COLD Freiburg part B — environment configuration.
# Everything dataset-specific lives here, not in code.
player:
  dataset_root: "/workspace/encoder/seq_data"
  # Single-run pipeline: map one sequence at a time.
  sequences:
    - "cold-freiburg_part_b_seq3_sunny1"
  images_subdir: "std_cam"
  labels_subpath: "localization/places.lst"   # relative to each sequence dir
  publish_rate_hz: 5.0
  inter_sequence_pause_s: 5.0
  odom_seed: 17
  # Odometry motion-model noise coefficients (alpha1..4); zero disables drift.
  alpha: [0.025, 0.005, 0.01, 0.0025]   # odometry motion-model noise (alpha1..4)

mapping:
  window_size: 30
  valley_k: 1.25             # node-creation sensitivity (lower = more, finer-grained nodes)
  merge_radius: 1.5          # radius (m) of the geometric gate; larger = more merges, fewer nodes
  visual_outlier_k: 0.5     # visual revisit strictness (MAD multiplier); lower = more merges / loop closures
  extractor: "finetuned:src"  # fine-tuned DINO encoder; "dinov2" for the stock backbone
  model_name: "visual_encoder_dino_contrastive_dim128_best"  # .pth name in <encoder_path>/models, or absolute path
  encoder_path: "/workspace/encoder"  # encoder repo root (contains src/ and models/)
  output_dir: "output/freiburg_ext"
  run_name: "freiburg_ext"

language:
  graph_path: "output/freiburg_ext/final_graph.pkl"
  semantic_model: "openai/clip-vit-base-patch32"
  mode: "manual"             # "manual" (one-shot query_sentence) or "topic" (live /language/command)
  query_sentence: "corridor"
  top_k: 3
  output_dir: "output/freiburg_ext/commands"
