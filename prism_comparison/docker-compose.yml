services:
  # GPU run (requires NVIDIA GPU + nvidia-container-toolkit / Docker Desktop WSL2 GPU)
  prism:
    build: .
    image: prism-topomap-cold
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: bash /workspace/run_all_inner.sh

  # CPU fallback (no GPU needed; slower, timings not comparable)
  prism-cpu:
    build: .
    image: prism-topomap-cold
    platform: linux/amd64
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=
    command: bash /workspace/run_all_inner.sh
