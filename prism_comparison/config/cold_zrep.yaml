# PRISM-TopoMap configuration for the COLD dataset (offline replay).
#
# Parameter values follow the authors' indoor Habitat experiment with noised
# odometry (config/habitat_mp3d_noised_odom.yaml in their repo), including the
# same minkloc3d_nclt.pth place-recognition weights. Only the input section
# differs: COLD provides a single planar 2D laser (converted to a point cloud
# at z=0), no back camera, so images are disabled and the point-cloud
# height filter brackets z=0.
input:
  pointcloud:
    topic: /cold/points          # unused in offline replay, kept for reference
    subscribe_to_curbs: false
    fields: xyz
    rotation_matrix: [[1., 0., 0.],
                      [0., 1., 0.],
                      [0., 0., 1.]]
    floor_height: -0.5
    ceiling_height: 0.5
  odometry:
    topic: /odom
    type: Odometry
  subscribe_to_gt_pose: true
  gt_pose:
    topic: /odom_gt
    type: Odometry
  subscribe_to_images: false
topomap:
  mode: mapping
  iou_threshold: 0.3
  max_edge_length: 5.0
  localization_frequency: 3.0
  localization_timeout: 0.0
  rel_pose_correction_frequency: 1.0
  drift_coef: 0.2
place_recognition:
  model: minkloc3d
  weights_path: /workspace/weights/minkloc3d_nclt.pth
  model_config_path: configs/model/place_recognition/resnet18-seqgem_minkloc3dv2.yaml
  top_k: 5
  pointcloud_quantization_size: 0.2
local_occupancy_grid:
  resolution: 0.1
  radius: 18.0
  max_range: 8.0
scan_matching:
  model: feature2d
  detector_type: ORB
  score_threshold: 0.6
  outlier_thresholds: [2.5, 1, 0.5, 0.25, 0.25]
  min_matches: 5
scan_matching_along_edge:
  model: feature2d
  detector_type: HarrisWithDistance
  score_threshold: 0.5
  outlier_thresholds: [2.5, 1, 0.5, 0.25, 0.25]
  min_matches: 5
  jump_threshold: 1.0
visualization:
  publish_gt_map: false
  map_frame: map
  publish_tf_from_odom: false
  vertex_marker_size: 0.3
  edge_marker_size: 0.1
  text_marker_size: 0.3
  match_marker_size: 0.5
  vcur_marker_size: 0.7
  loop_closure_marker_size: 0.5
  loop_closure_edge_marker_size: 0.3
  path_marker_size: 0.3
  vertex_orientation_marker_size: 0.05

# Driver-specific settings (not part of the upstream PRISM-TopoMap config).
driver:
  # Aggregate the last N seconds of 2D scans (motion-compensated with the
  # input odometry) into each input point cloud, and feed the model at
  # `update_rate_hz`. A single 181-beam scan is far sparser than the 3D LiDAR
  # clouds PRISM-TopoMap was designed for; short-horizon aggregation is pure
  # input preprocessing and keeps the baseline strong.
  scan_aggregation_window_s: 1.0
  update_rate_hz: 5.0
  # The weights path above is absolute inside the container; the model config
  # path is resolved relative to the OpenPlaceRecognition source tree.
  z_replicate_heights: [-0.4, -0.2, 0.0, 0.2, 0.4]
